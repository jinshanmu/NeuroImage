name: Code-only validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: NeuroImage
          environment-file: environment.yml
          auto-activate-base: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned project stack
        run: |
          python -m pip install -r requirements-core.lock.txt -r requirements-dev.lock.txt -r requirements-source-inspection.lock.txt
          npm ci --ignore-scripts --bin-links=false
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate source and frontend behavior
        run: |
          python -m pytest
          npm test
          npm run build
          python scripts/audit_code_release.py --include-untracked
      - name: Build audited software distributions
        run: python scripts/build_distribution.py --skip-web-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-code-only-distributions
          path: dist/
          if-no-files-found: error
