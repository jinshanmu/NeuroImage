name: Software problem
description: Report a reproducible installation, viewing or teaching problem.
body:
  - type: markdown
    attributes:
      value: "For a suspected vulnerability, use the private contact in SECURITY.md. Include source identifiers and steps; keep acquired images, patient information and credentials out of attachments."
  - type: input
    id: version
    attributes:
      label: Software version and platform
      description: Include the NeuroImage version, Linux distribution and browser version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Explain the steps, expected behavior and what happened. Include the source recipe and package version when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Diagnostic information
      description: Include relevant error text or a small generated reproduction. Review logs for personal paths before posting.
