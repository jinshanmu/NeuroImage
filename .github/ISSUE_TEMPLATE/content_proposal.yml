name: Anatomy or browsing proposal
description: Propose source-supported normal anatomy or a browsing improvement.
body:
  - type: textarea
    id: proposal
    attributes:
      label: Anatomical topic and proposed behavior
      description: Describe the anatomical topic, intended users and the useful browsing interaction.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Original source evidence
      description: Provide official source URLs, versions, terms and available anatomical definitions. Explain which representation supports the proposal.
    validations:
      required: true
